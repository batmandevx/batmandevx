<svg xmlns="http://www.w3.org/2000/svg" width="900" height="210" viewBox="0 0 900 210">
<style>
  text { font-family: 'Fira Code','JetBrains Mono','DejaVu Sans Mono',Menlo,Consolas,monospace; }
  .card { opacity: 0; animation: rise .7s cubic-bezier(.2,.8,.2,1) forwards; }
  @keyframes rise { from { opacity:0; transform: translateY(18px); } to { opacity:1; transform: translateY(0); } }
  .dash { stroke-dasharray: 60 540; animation: run 3.2s linear infinite; }
  @keyframes run { to { stroke-dashoffset: -600; } }
  .float { animation: float 3s ease-in-out infinite; }
  @keyframes float { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-4px); } }
</style>
<defs><filter id="gl" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="3"/></filter></defs>
<g class="card" style="animation-delay:0.20s"><g class="float" style="animation-delay:0.0s">
<rect x="25" y="20" width="270" height="160" rx="16" fill="#0D1117" stroke="#30363D" stroke-width="1.5"/>
<rect class="dash" x="25" y="20" width="270" height="160" rx="16" fill="none" stroke="#22D3EE" stroke-width="2.5" filter="url(#gl)" style="animation-delay:0.0s"/>
<rect class="dash" x="25" y="20" width="270" height="160" rx="16" fill="none" stroke="#22D3EE" stroke-width="2" style="animation-delay:0.0s"/>
<text x="49" y="66" font-size="30" font-weight="700" fill="#22D3EE" opacity="0.9">01</text>
<text x="49" y="112" font-size="17" font-weight="700" fill="#E6EDF3">LLM Post-Training</text>
<text x="49" y="142" font-size="13" fill="#8B949E">SFT · alignment · evals</text>
<rect x="49" y="156" width="40" height="3" rx="1.5" fill="#22D3EE"><animate attributeName="width" values="40;222;40" dur="4s" begin="0.0s" repeatCount="indefinite"/></rect>
</g></g>
<g class="card" style="animation-delay:0.45s"><g class="float" style="animation-delay:0.6s">
<rect x="315" y="20" width="270" height="160" rx="16" fill="#0D1117" stroke="#30363D" stroke-width="1.5"/>
<rect class="dash" x="315" y="20" width="270" height="160" rx="16" fill="none" stroke="#A78BFA" stroke-width="2.5" filter="url(#gl)" style="animation-delay:0.8s"/>
<rect class="dash" x="315" y="20" width="270" height="160" rx="16" fill="none" stroke="#A78BFA" stroke-width="2" style="animation-delay:0.8s"/>
<text x="339" y="66" font-size="30" font-weight="700" fill="#A78BFA" opacity="0.9">02</text>
<text x="339" y="112" font-size="17" font-weight="700" fill="#E6EDF3">RAG Systems</text>
<text x="339" y="142" font-size="13" fill="#8B949E">retrieval · grounding · agents</text>
<rect x="339" y="156" width="40" height="3" rx="1.5" fill="#A78BFA"><animate attributeName="width" values="40;222;40" dur="4s" begin="0.5s" repeatCount="indefinite"/></rect>
</g></g>
<g class="card" style="animation-delay:0.70s"><g class="float" style="animation-delay:1.2s">
<rect x="605" y="20" width="270" height="160" rx="16" fill="#0D1117" stroke="#30363D" stroke-width="1.5"/>
<rect class="dash" x="605" y="20" width="270" height="160" rx="16" fill="none" stroke="#F472B6" stroke-width="2.5" filter="url(#gl)" style="animation-delay:1.6s"/>
<rect class="dash" x="605" y="20" width="270" height="160" rx="16" fill="none" stroke="#F472B6" stroke-width="2" style="animation-delay:1.6s"/>
<text x="629" y="66" font-size="30" font-weight="700" fill="#F472B6" opacity="0.9">03</text>
<text x="629" y="112" font-size="17" font-weight="700" fill="#E6EDF3">Inference Optimization</text>
<text x="629" y="142" font-size="13" fill="#8B949E">faster · cheaper · leaner</text>
<rect x="629" y="156" width="40" height="3" rx="1.5" fill="#F472B6"><animate attributeName="width" values="40;222;40" dur="4s" begin="1.0s" repeatCount="indefinite"/></rect>
</g></g>
</svg>