  text { font-family: 'Fira Code','JetBrains Mono','DejaVu Sans Mono',Menlo,Consolas,monospace; }
  .fade { opacity: 0; animation: in .35s ease forwards; }
  @keyframes in { to { opacity: 1; } }
  .glitch { animation: glitch 7s infinite steps(1); }
  @keyframes glitch {
    0%,93%,100% { transform: translate(0,0); }
    94% { transform: translate(-3px,1px); }
    95% { transform: translate(3px,-1px); }
    96% { transform: translate(-1px,0); }
  }
  .blink { animation: blink 1s infinite steps(1); }
  @keyframes blink { 50% { opacity: 0; } }
  .pulse { animation: pulse 1.6s ease-in-out infinite; transform-origin: center; transform-box: fill-box; }
